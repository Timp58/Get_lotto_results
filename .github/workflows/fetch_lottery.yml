name: Fetch National Lottery CSV Results

on:
  # Schedule: Lotto draws are Wednesday and Saturday nights.
  # Run Thursdays and Sundays at 04:00 UTC (cron syntax: min hour day month day-of-week)
  schedule:
    - cron: '0 4 * * 0,4'
  
  # Allows you to trigger the workflow manually from the GitHub UI for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Lotto XML and convert to CSV
        run: |
          curl -sSL "https://www.national-lottery.co.uk/results/lotto/draw-history/xml" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -o raw_lotto.xml

          python3 - << 'EOF'
          import csv
          import xml.etree.ElementTree as ET

          tree = ET.parse("raw_lotto.xml")
          root = tree.getroot()

          # Column headers matching historical Lotto formats
          fieldnames = [
              "DrawNumber",
              "DrawDate",
              "Ball 1",
              "Ball 2",
              "Ball 3",
              "Ball 4",
              "Ball 5",
              "Ball 6",
              "Bonus Ball",
              "Ball Set",
              "Draw Machine",
              "Rollover",
              "Rollover Count",
              "Next Estimated Jackpot"
          ]

          rows = []

          for game in root.findall(".//game"):
              draw_elem = game.find("draw")
              draw_num = draw_elem.findtext("draw-number", default="") if draw_elem is not None else ""
              draw_date = draw_elem.findtext("draw-date", default="") if draw_elem is not None else ""
              
              # First machine entry is typically the primary Lotto draw machine
              machines = [m.text for m in draw_elem.findall("draw-machine") if m.text] if draw_elem is not None else []
              machine = machines[0] if machines else ""

              rollover = game.findtext("rollover", default="")
              rollover_count = game.findtext("rollover-count", default="")
              jackpot = game.findtext("next-estimated-jackpot", default="")

              # Each <balls> node is a draw set (e.g., Main Lotto vs Extra)
              for balls_elem in game.findall("balls"):
                  ball_set = balls_elem.findtext("set", default="")
                  
                  # Extract balls ordered by the 'number' attribute
                  balls = {}
                  for b in balls_elem.findall("ball"):
                      idx = b.attrib.get("number")
                      if idx:
                          balls[f"Ball {idx}"] = b.text.strip() if b.text else ""

                  bonus = balls_elem.findtext("bonus-ball", default="")

                  row = {
                      "DrawNumber": draw_num,
                      "DrawDate": draw_date,
                      "Ball 1": balls.get("Ball 1", ""),
                      "Ball 2": balls.get("Ball 2", ""),
                      "Ball 3": balls.get("Ball 3", ""),
                      "Ball 4": balls.get("Ball 4", ""),
                      "Ball 5": balls.get("Ball 5", ""),
                      "Ball 6": balls.get("Ball 6", ""),
                      "Bonus Ball": bonus,
                      "Ball Set": ball_set,
                      "Draw Machine": machine,
                      "Rollover": rollover,
                      "Rollover Count": rollover_count,
                      "Next Estimated Jackpot": jackpot
                  }
                  rows.append(row)

          with open("raw_lotto.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"Parsed {len(rows)} record(s) into raw_lotto.csv")
          EOF

          cat raw_lotto.csv
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lotto_results.csv
          
          # Only commit if the downloaded file has actually changed
          if git diff --staged --quiet; then
            echo "No new results found. Nothing to commit."
          else
            git commit -m "chore: update National Lottery results $(date -u +'%Y-%m-%d')"
            git push
          fi
