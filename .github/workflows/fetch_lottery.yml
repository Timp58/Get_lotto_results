- name: Download and format National Lottery CSV
        run: |
          # 1. Download raw content
          curl -sSfL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            "https://www.national-lottery.co.uk/results/lotto/draw-history/csv" \
            -o raw_lotto.csv

          # 2. Re-insert newline after every 10th comma-separated field
          awk -F',' -v OFS=',' '{
            for (i = 1; i <= NF; i++) {
              printf "%s%s", $i, (i % 10 == 0 || i == NF ? "\n" : OFS)
            }
          }' raw_lotto.csv > lotto_results.csv

          rm raw_lotto.csv
