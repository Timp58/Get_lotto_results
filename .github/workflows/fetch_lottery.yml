name: Fetch National Lottery CSV Results

on:
  # Schedule: Lotto draws are Wednesday and Saturday nights.
  # Run Thursdays and Sundays at 04:00 UTC (cron syntax: min hour day month day-of-week)
  schedule:
    - cron: '0 4 * * 0,4'
  
  # Allows you to trigger the workflow manually from the GitHub UI for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Lotto XML and convert to CSV
        run: |
          # 1. Download the redirected XML file directly to raw_lotto.xml
          curl -sSL "https://www.national-lottery.co.uk/results/lotto/draw-history/xml" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -o raw_lotto.xml

          # 2. Parse XML into raw_lotto.csv using standard Python libraries
          python3 - << 'EOF'
          import csv
          import xml.etree.ElementTree as ET

          tree = ET.parse("raw_lotto.xml")
          root = tree.getroot()

          # Find repeat draw nodes or fallback to all direct child elements
          draws = root.findall(".//draw")
          if not draws:
              # Fallback if the XML uses a different tag structure
              draws = [child for child in root if len(child) > 0]

          if draws:
              # Collect all unique field tags across items while preserving order
              fieldnames = []
              for draw in draws:
                  for child in draw:
                      if child.tag not in fieldnames:
                          fieldnames.append(child.tag)

              with open("raw_lotto.csv", "w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames)
                  writer.writeheader()
                  for draw in draws:
                      row = {child.tag: (child.text or "").strip() for child in draw}
                      writer.writerow(row)
              print("Successfully generated raw_lotto.csv")
          else:
              print("Warning: No draw elements found in raw_lotto.xml")
          EOF

          # Verify file exists for subsequent steps
          ls -lh raw_lotto.csv
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lotto_results.csv
          
          # Only commit if the downloaded file has actually changed
          if git diff --staged --quiet; then
            echo "No new results found. Nothing to commit."
          else
            git commit -m "chore: update National Lottery results $(date -u +'%Y-%m-%d')"
            git push
          fi
