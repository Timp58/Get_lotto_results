name: Fetch National Lottery CSV Results

on:
  # Schedule: Lotto draws are Wednesday and Saturday nights.
  # Run Thursdays and Sundays at 04:00 UTC (cron syntax: min hour day month day-of-week)
  schedule:
    - cron: '0 4 * * 0,4'
  
  # Allows you to trigger the workflow manually from the GitHub UI for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download National Lottery CSV
        run: |
          curl -v -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,text/csv,*/*;q=0.8" \
            -H "Accept-Language: en-GB,en;q=0.9" \
            -H "Referer: https://www.national-lottery.co.uk/results/lotto/draw-history" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-Site: same-origin" \
            -H "Upgrade-Insecure-Requests: 1" \
            "https://www.national-lottery.co.uk/results/lotto/draw-history/csv" \
            -o raw_lotto.csv.csv
           ls -la raw_lotto.csv    

          # 2. Re-insert newline after every 10th comma-separated field
          awk -F',' -v OFS=',' '{
            for (i = 1; i <= NF; i++) {
              printf "%s%s", $i, (i % 10 == 0 || i == NF ? "\n" : OFS)
            }
          }' raw_lotto.csv > lotto_results.csv

          rm raw_lotto.csv

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lotto_results.csv
          
          # Only commit if the downloaded file has actually changed
          if git diff --staged --quiet; then
            echo "No new results found. Nothing to commit."
          else
            git commit -m "chore: update National Lottery results $(date -u +'%Y-%m-%d')"
            git push
          fi
