name: Fetch National Lottery CSV Results

on:
  # Schedule: Lotto draws are Wednesday and Saturday nights.
  # Run Thursdays and Sundays at 04:00 UTC (cron syntax: min hour day month day-of-week)
  schedule:
    - cron: '0 4 * * 0,4'
  
  # Allows you to trigger the workflow manually from the GitHub UI for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Lotto XML and convert to CSV
        run: |
          # 1. Download
          curl -sSL "https://www.national-lottery.co.uk/results/lotto/draw-history/xml" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -o raw_lotto.xml

          # 2. Inspect raw downloaded content in logs
          echo "=== First 20 lines of raw_lotto.xml ==="
          head -n 20 raw_lotto.xml
          echo "========================================"

          # 3. Flexible converter
          python3 - << 'EOF'
          import csv
          import xml.etree.ElementTree as ET

          tree = ET.parse("raw_lotto.xml")
          root = tree.getroot()

          # Strip XML namespaces if present
          for elem in root.iter():
              if "}" in elem.tag:
                  elem.tag = elem.tag.split("}", 1)[1]

          # Find all leaf elements or record containers
          # Check common container names, otherwise take direct children of root
          records = []
          for child in list(root):
              row_data = {}
              # If child has nested elements (e.g., <draw><date>...</date></draw>)
              if len(child) > 0:
                  for sub in child:
                      row_data[sub.tag] = (sub.text or "").strip()
              # If attributes are used instead (e.g., <draw date="..." ball1="..." />)
              if child.attrib:
                  row_data.update(child.attrib)
              
              if row_data:
                  records.append(row_data)

          if not records:
              # Fallback: search recursively for any elements with children
              for node in root.iter():
                  if len(node) > 0 and node != root:
                      row_data = {sub.tag: (sub.text or "").strip() for sub in node}
                      if row_data:
                          records.append(row_data)

          if records:
              # Collect all keys preserving appearance order
              keys = []
              for r in records:
                  for k in r.keys():
                      if k not in keys:
                          keys.append(k)

              with open("raw_lotto.csv", "w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=keys)
                  writer.writeheader()
                  writer.writerows(records)
              print(f"Generated raw_lotto.csv with {len(records)} rows.")
          else:
              print("No records could be parsed from XML.")
          EOF

          # Verify output
          ls -lh raw_lotto.csv
          cat raw_lotto.csv
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lotto_results.csv
          
          # Only commit if the downloaded file has actually changed
          if git diff --staged --quiet; then
            echo "No new results found. Nothing to commit."
          else
            git commit -m "chore: update National Lottery results $(date -u +'%Y-%m-%d')"
            git push
          fi
