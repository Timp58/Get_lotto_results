name: Fetch National Lottery CSV Results

on:
  # Schedule: Lotto draws are Wednesday and Saturday nights.
  # Run Thursdays and Sundays at 04:00 UTC (cron syntax: min hour day month day-of-week)
  schedule:
    - cron: '0 4 * * 0,4'
  
  # Allows you to trigger the workflow manually from the GitHub UI for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download National Lottery CSV
        run: |
          # Fetch the official 180-day Lotto draw history CSV
          # -s: silent, -S: show error, -f: fail on HTTP errors, -L: follow redirects
          # Pass standard browser User-Agent headers to ensure the CDN accepts the request
          curl -sSfL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Accept: text/csv,application/csv,text/plain" \
            "https://www.national-lottery.co.uk/results/lotto/draw-history/csv" \
            -o lotto_results.csv

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lotto_results.csv
          
          # Only commit if the downloaded file has actually changed
          if git diff --staged --quiet; then
            echo "No new results found. Nothing to commit."
          else
            git commit -m "chore: update National Lottery results $(date -u +'%Y-%m-%d')"
            git push
          fi
